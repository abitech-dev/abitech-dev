name: Publicar en prod

on:
  # 06:00 en Lima. El tema cambia los lunes y las estadísticas cada día.
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      tema:
        description: Tema para esta ejecución. Vacío usa el de la semana.
        type: choice
        options: ['', corporativo, tech, ejecutivo]
        default: ''
  push:
    branches: [main]
    paths: [perfil.json, 'generador/**', 'pruebas/**', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    name: Revisar cambios
    uses: ./.github/workflows/ci.yml

  generar:
    name: Generar y publicar el perfil
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Generar README y SVG
        run: node generador/generar.mjs ${TEMA:+--tema=$TEMA}
        env:
          TEMA: ${{ inputs.tema }}
          # Las privadas cuentan si el perfil muestra "private contributions".
          GITHUB_TOKEN: ${{ github.token }}

      # Solo el bot empuja a main, y solo archivos generados (ADR 0001).
      - name: Publicar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md README.en.md assets datos
          if git diff --cached --quiet; then
            echo 'El perfil no cambió.'
            exit 0
          fi
          git commit -m 'chore(perfil): actualizar README y estadísticas'
          git push
